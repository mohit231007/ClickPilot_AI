[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clickpilot-ai"
version = "0.1.0"
description = "Production-style CTR prediction, ranking, and ad decision intelligence platform."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Mohit Bhatnagar"}]
dependencies = [
  "catboost>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.8,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.39,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# Keep the production lint contract explicit so Ruff upgrades do not silently
# broaden the rule set. The original notebook is preserved as case-study evidence
# and is intentionally not treated as a standalone Python module.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
